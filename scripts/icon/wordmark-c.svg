<?xml version="1.0" encoding="UTF-8"?>
<!--
  方案 C 的字标：单行 FitHub，Fit 用 #7FE3C4，Hub 用 #FFFFFF。
  背景是 @color/launcher_bg (#14624F)，由 mipmap-anydpi-v26 里的 adaptive-icon 负责。

  ⚠️ 这里的文字是 <text>，**只能用于生成 PNG，不能直接当 Android 资源**：
  Android 的 VectorDrawable 不支持 <text>，要进 res/drawable 必须把字形轮廓转成 <path>。
  本文件的作用是锁定「哪个字、什么颜色、多大、什么字距」，转换脚本读它来产 path。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#14624F"/>
  <text x="54" y="54" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-0.8"><tspan fill="#7FE3C4">Fit</tspan><tspan fill="#FFFFFF">Hub</tspan></text>
</svg>
